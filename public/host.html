<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurovizija Quiz – Vedėjas</title>
<style>
:root{--bg:#0d0b1a;--s:#16132a;--s2:#1e1a35;--bd:rgba(255,255,255,0.08);--pu:#7c5cfc;--pl:#a68dff;--go:#f5c842;--gr:#3ecf8e;--re:#ff5c5c;--tx:#f0eeff;--mu:rgba(240,238,255,0.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--s);border-right:.5px solid var(--bd);padding:1rem;display:flex;flex-direction:column;gap:.5rem;overflow-y:auto;}
.main{padding:1.25rem;overflow-y:auto}
.logo-row{display:flex;align-items:center;gap:8px;margin-bottom:.5rem}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pu);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.app-title{font-size:14px;font-weight:700;flex:1}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(124,92,252,.15);color:var(--pl);border:.5px solid rgba(124,92,252,.3)}
.sec{font-size:10px;letter-spacing:.08em;color:var(--mu);font-weight:500;text-transform:uppercase;margin-bottom:4px;margin-top:8px}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.btn:disabled{opacity:.3;cursor:default}
.btn-pu{background:var(--pu);color:#fff}
.btn-gr{background:rgba(62,207,142,.12);color:var(--gr);border:.5px solid rgba(62,207,142,.3)}
.btn-gray{background:var(--s2);color:var(--mu);border:.5px solid var(--bd)}
.btn-re{background:rgba(255,92,92,.1);color:var(--re);border:.5px solid rgba(255,92,92,.25)}
.p-row{display:flex;align-items:center;gap:4px;padding:5px 0;border-bottom:.5px solid rgba(255,255,255,.05);font-size:12px}
.p-row:last-child{border:none}
.p-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-pts{font-size:15px;font-weight:700;color:var(--pl);min-width:22px;text-align:right}
.adj-btns{display:flex;gap:2px;flex-shrink:0}
.adj{padding:2px 5px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:none;font-family:inherit}
.adj-p{background:rgba(62,207,142,.15);color:var(--gr)}
.adj-m{background:rgba(255,92,92,.1);color:var(--re)}
.cheat-flag{font-size:10px;color:#ff5c5c;flex-shrink:0;}

/* LOBBY */
#ph-lobby.active{display:flex;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background-color:#07061a;}
.lobby-bg{position:absolute;inset:-5%;background-image:url('/bg.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;animation:slowzoom 25s ease-in-out infinite alternate;z-index:0;will-change:transform;transform:translateZ(0);}
@keyframes slowzoom{from{transform:translateZ(0) scale(1);}to{transform:translateZ(0) scale(1.06);}}
.lobby-overlay{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:0;}
.lobby-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;}
.lobby-title{font-size:clamp(1.6rem,3.5vw,2.8rem);font-weight:200;color:#fff;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.3rem;opacity:.9;}
.lobby-title strong{font-weight:800;letter-spacing:.05em;}
.lobby-year{font-size:.75rem;letter-spacing:.4em;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:3rem;}
.lobby-countdown{font-size:clamp(2rem,4vw,3.5rem);font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;transition:color .4s;margin-bottom:.4rem;}
.lobby-countdown.urgent{color:#ff6b6b;}
.lobby-countdown-lbl{font-size:.65rem;letter-spacing:.3em;color:rgba(255,255,255,.25);text-transform:uppercase;margin-bottom:2rem;}
.lobby-players{font-size:.7rem;letter-spacing:.2em;color:rgba(255,255,255,.2);text-transform:uppercase;}
.lobby-players span{color:rgba(255,255,255,.5);font-weight:700;}
.music-hint{position:fixed;top:1.2rem;right:1.2rem;font-size:.65rem;letter-spacing:.15em;color:rgba(255,255,255,.25);text-transform:uppercase;z-index:3;cursor:pointer;}

/* QUESTION */
.ph{display:none}
.ph.active{display:block}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.q-timer-bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.q-timer-fill{height:100%;background:var(--pu);border-radius:3px;transition:width 1s linear;}
.q-timer-fill.urgent{background:var(--re);}
.q-timer-num{font-size:1.2rem;font-weight:800;color:var(--pl);min-width:28px;text-align:right;font-variant-numeric:tabular-nums;}
.q-card{background:var(--s);border:.5px solid var(--bd);border-radius:14px;padding:1.125rem;margin-bottom:1rem}
.q-meta{font-size:11px;color:var(--mu);margin-bottom:.4rem}
.q-text{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:1rem}
.opts-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.875rem}
.opts-grid-3{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:.875rem}
.opts-grid-4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.875rem}
.opt-row{border-radius:10px;padding:10px 12px;border:.5px solid var(--bd);background:var(--s2);display:flex;align-items:center;gap:8px;}
.opt-row.correct{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.45)}
.opt-letter{width:24px;height:24px;border-radius:7px;background:rgba(124,92,252,.15);color:var(--pl);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt-row.correct .opt-letter{background:var(--gr);color:#fff}
.opt-text{font-size:13px;flex:1;font-weight:500}
.opt-count{font-size:16px;font-weight:700;color:var(--pl);}
.opt-row.correct .opt-count{color:var(--gr);}
.mini-bar{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:4px}
.mini-fill{height:100%;background:var(--pu);border-radius:2px;}
.opt-row.correct .mini-fill{background:var(--gr)}
.fact-box{background:rgba(124,92,252,.08);border:.5px solid rgba(124,92,252,.2);border-radius:10px;padding:10px 12px;margin-bottom:.875rem}
.fact-l{font-size:10px;color:var(--pl);letter-spacing:.06em;margin-bottom:3px;text-transform:uppercase}
.fact-t{font-size:12px;color:var(--tx);line-height:1.5}
.ans-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:.4rem}
.ans-chip{padding:4px 9px;border-radius:7px;font-size:11px;background:var(--s2);border:.5px solid var(--bd);color:var(--tx)}
.ans-chip.correct{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3);color:var(--gr)}
.r-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem}
.r-pill{padding:4px 10px;border-radius:20px;font-size:11px;border:.5px solid var(--bd);background:var(--s);color:var(--mu);cursor:pointer}
.r-pill.active{background:rgba(124,92,252,.18);border-color:var(--pu);color:var(--pl);font-weight:500}
.r-pill.done{background:rgba(62,207,142,.08);border-color:rgba(62,207,142,.25);color:var(--gr)}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--s);margin-bottom:6px}
.lb-row.top{background:rgba(245,200,66,.07);border:.5px solid rgba(245,200,66,.2)}
.lb-pts{font-size:18px;font-weight:700;color:var(--pl)}
.lb-row.top .lb-pts{color:var(--go)}

/* CHEAT ALERTS */
.cheat-list{margin-top:.5rem;}
.cheat-item{font-size:11px;color:#ff5c5c;padding:3px 0;border-bottom:.5px solid rgba(255,92,92,.1);}

@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:.5px solid var(--bd)}}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="main-sidebar">
    <div class="logo-row">
      <div class="logo">E</div>
      <div class="app-title">Vedėjas</div>
      <span class="badge" id="ph-badge">Lobby</span>
    </div>
    <div class="sec">Žaidėjai (<span id="stat-p">0</span>)</div>
    <div id="players-list"><div style="font-size:11px;color:var(--mu);padding:.25rem 0">Laukiama...</div></div>
    <div class="sec">Anti-cheat</div>
    <div class="cheat-list" id="cheat-list"><div style="font-size:11px;color:var(--mu)">Nieko</div></div>
    <div style="margin-top:auto;padding-top:.5rem">
      <a href="/settings" style="display:block;width:100%;padding:7px 14px;border-radius:8px;background:var(--s2);border:.5px solid var(--bd);color:var(--mu);font-size:11px;font-weight:500;text-align:center;text-decoration:none;margin-bottom:6px;">⚙️ Nustatymai</a>
      <button class="btn btn-re" style="width:100%;font-size:11px" onclick="if(confirm('Iš naujo?'))socket.emit('host:reset')">Naujas žaidimas</button>
    </div>
  </div>

  <div class="main" id="main-content">

    <!-- LOBBY -->
    <div class="ph active" id="ph-lobby">
      <div class="lobby-bg"></div>
      <div class="lobby-overlay"></div>
      <div class="music-hint" id="music-hint" onclick="startMusic()">♪ spausk muzikai</div>
      <div class="lobby-content">
        <div class="lobby-title">Eurovizijos <strong>PopQuiznas</strong></div>
        <div class="lobby-year">Viena · 2026</div>
        <div class="lobby-countdown" id="countdown">9:30</div>
        <div class="lobby-countdown-lbl">iki pradžios</div>
        <div class="lobby-players">Prisijungę: <span id="lobby-count">0</span></div>
        <div id="start-btn-wrap" style="margin-top:1.5rem;display:none;">
          <button onclick="socket.emit('host:start');stopMusic();" style="padding:.75rem 2rem;border-radius:50px;border:none;background:#fff;color:#07061a;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.04em;">Pradėti žaidimą →</button>
        </div>
      </div>
      <iframe id="yt-player" width="1" height="1" style="position:absolute;opacity:0.01;pointer-events:none;bottom:0;left:0" src="about:blank" allow="autoplay" frameborder="0"></iframe>
    </div>

    <!-- QUESTION -->
    <div class="ph" id="ph-question">
      <div class="q-header">
        <div class="q-timer-bar"><div class="q-timer-fill" id="q-timer-fill" style="width:100%"></div></div>
        <div class="q-timer-num" id="q-timer-num">15</div>
      </div>
      <div class="r-pills" id="r-pills"></div>
      <div class="q-card">
        <div class="q-meta" id="q-meta"></div>
        <div class="q-text" id="q-text"></div>
        <div id="opts-area"></div>
        <div class="fact-box" id="fact-box" style="display:none">
          <div class="fact-l">Įdomu žinoti</div>
          <div class="fact-t" id="fact-text"></div>
        </div>
        <div style="margin-bottom:.75rem">
          <div style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem">Atsakė (<span id="ans-count">0</span>/<span id="ans-total">0</span>)</div>
          <div class="ans-grid" id="ans-grid"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-gray" onclick="socket.emit('host:prev')">Atgal</button>
          <button class="btn btn-gr" id="reveal-btn" onclick="socket.emit('host:reveal')">Atskleisti</button>
          <button class="btn btn-pu" id="next-btn" onclick="socket.emit('host:next')">Kitas</button>
        </div>
      </div>
    </div>

    <!-- LB -->
    <div class="ph" id="ph-lb">
      <div style="font-size:16px;font-weight:700;margin-bottom:1rem">Rikiuotė</div>
      <div id="lb-content"></div>
      <div style="display:flex;gap:8px;margin-top:1rem">
        <button class="btn btn-gray" onclick="showQ()">Grįžti</button>
        <button class="btn btn-pu" onclick="socket.emit('host:next')">Kitas klausimas</button>
      </div>
    </div>

    <!-- FINAL -->
    <div class="ph" id="ph-final">
      <div style="text-align:center;padding:2rem 1rem;max-width:400px;margin:0 auto">
        <div style="font-size:52px;margin-bottom:1rem">🏆</div>
        <div style="font-size:22px;font-weight:700;margin-bottom:.25rem">Žaidimas baigtas!</div>
        <div style="font-size:13px;color:var(--mu);margin-bottom:1.5rem">Galutinė rikiuotė</div>
        <div id="final-lb"></div>
        <button class="btn btn-pu" style="margin-top:1rem;padding:10px 24px" onclick="if(confirm('Iš naujo?'))socket.emit('host:reset')">Naujas žaidimas</button>
      </div>
    </div>

  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const LETTERS=['A','B','C','D'];
let state={};
const socket=io({query:{role:'host'}});
socket.on('state',s=>{state=s;render();});
socket.on('timer',({timeLeft})=>updateTimer(timeLeft));
socket.on('cheat_alert',({name,count})=>{
  const list=document.getElementById('cheat-list');
  const item=document.createElement('div');
  item.className='cheat-item';
  item.textContent=`${name} išėjo iš programos (${count}x)`;
  list.innerHTML='';
  list.appendChild(item);
  setTimeout(()=>{if(list.contains(item))list.removeChild(item);},8000);
});

// MUSIC
const YT_SRC="https://www.youtube.com/embed/2N_7XtyJVbA?autoplay=1&start=0&loop=1&playlist=2N_7XtyJVbA&controls=0&mute=0";
let musicStarted=false;
function startMusic(){
  if(musicStarted)return;
  musicStarted=true;
  document.getElementById('yt-player').src=YT_SRC;
  document.getElementById('music-hint').textContent='♪ groja';
}
document.addEventListener('click',function once(){startMusic();document.removeEventListener('click',once);},{once:true});
function stopMusic(){document.getElementById('yt-player').src='about:blank';musicStarted=false;}

// LOBBY COUNTDOWN
let lobbySeconds=9*60+30, lobbyInterval;
function startLobbyCountdown(){
  lobbyInterval=setInterval(()=>{
    lobbySeconds--;
    if(lobbySeconds<0){clearInterval(lobbyInterval);stopMusic();socket.emit('host:start');return;}
    const m=Math.floor(lobbySeconds/60),s=lobbySeconds%60;
    const el=document.getElementById('countdown');
    if(el){el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('urgent',lobbySeconds<=60);}
  },1000);
}
// Host pats skaiciuoja ir siuncia zaiedejams
let lobbySeconds = 9*60+30;
let lobbyInterval = null;

function startLobbyCountdown(){
  if(lobbyInterval) clearInterval(lobbyInterval);
  lobbyInterval = setInterval(()=>{
    lobbySeconds--;
    // Siusti zaiedejams
    socket.emit('host_tick', { timeLeft: lobbySeconds });
    // Rodyti host lange
    const m=Math.floor(lobbySeconds/60), s=lobbySeconds%60;
    const fmt=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    const el=document.getElementById('countdown');
    if(el){ el.textContent=fmt; el.classList.toggle('urgent',lobbySeconds<=60); }
    if(lobbySeconds<=0){
      clearInterval(lobbyInterval);
      document.getElementById('start-btn-wrap').style.display='block';
    }
  },1000);
}

window.addEventListener('load',()=>{
  // Gauti settings ir tada paleisti laika
  fetch('/api/settings').then(r=>r.json()).then(s=>{
    lobbySeconds = s.lobbySeconds;
    startLobbyCountdown();
  }).catch(()=>startLobbyCountdown());
});

// TIMER
function updateTimer(timeLeft){
  const pct=(timeLeft/15)*100;
  const fill=document.getElementById('q-timer-fill');
  const num=document.getElementById('q-timer-num');
  if(fill){fill.style.width=pct+'%';fill.classList.toggle('urgent',timeLeft<=5);}
  if(num)num.textContent=timeLeft;
}

// LAYOUT
function setLobbyLayout(isLobby){
  document.getElementById('main-sidebar').style.display=isLobby?'none':'';
  const mc=document.getElementById('main-content');
  mc.style.gridColumn=isLobby?'1 / -1':'';
  mc.style.padding=isLobby?'0':'';
}

// RENDER
function render(){
  const{phase,players,scores,round,question,totalQuestions,totalRounds,
        roundName,questionText,options,correctIndex,fact,answerRevealed,answers,cheaters}=state;
  const playerList=Object.values(players||{});
  const sorted=[...playerList].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0));
  const medals=['🥇','🥈','🥉'];
  const ansArr=Object.values(answers||{});

  document.getElementById('ph-badge').textContent=phase==='lobby'?'Lobby':phase==='final'?'Finalas':roundName;
  document.getElementById('stat-p').textContent=playerList.length;
  document.getElementById('lobby-count').textContent=playerList.length;

  // Sidebar players
  const pl=document.getElementById('players-list');
  pl.innerHTML=sorted.length
    ?sorted.map((p,i)=>{
      const cheatCount=cheaters?.[p.id]||0;
      return`<div class="p-row">
        <span style="font-size:12px;width:18px;flex-shrink:0">${medals[i]||'·'}</span>
        <span class="p-name">${p.name}</span>
        ${cheatCount>0?`<span class="cheat-flag">⚠️${cheatCount}</span>`:''}
        <div class="adj-btns">
          <button class="adj adj-m" onclick="socket.emit('host:adjust',{playerId:'${p.id}',pts:-1})">-1</button>
          <button class="adj adj-p" onclick="socket.emit('host:adjust',{playerId:'${p.id}',pts:1})">+1</button>
        </div>
        <span class="p-pts">${scores[p.id]||0}</span>
      </div>`;
    }).join('')
    :'<div style="font-size:11px;color:var(--mu);padding:.25rem 0">Laukiama žaidėjų...</div>';

  ['lobby','question','lb','final'].forEach(p=>document.getElementById('ph-'+p).classList.remove('active'));
  setLobbyLayout(phase==='lobby');

  if(phase==='lobby'){document.getElementById('ph-lobby').classList.add('active');return;}
  // Muzika isjungiama kai prasideda zaidimas
  if(phase!=='lobby' && musicStarted){stopMusic();}

  if(phase==='question'){
    document.getElementById('ph-question').classList.add('active');
    const roundNames=['Istorija','Lietuva','ABBA ir faktai'];
    document.getElementById('r-pills').innerHTML=Array.from({length:totalRounds||3},(_,i)=>
      `<button class="r-pill${i===round?' active':i<round?' done':''}" onclick="socket.emit('host:jump',{round:${i}})">${i+1}. ${roundNames[i]||'Etapas '+(i+1)}</button>`
    ).join('');
    document.getElementById('q-meta').textContent=`${roundName} · Klausimas ${question+1}/${totalQuestions}`;
    document.getElementById('q-text').textContent=questionText;
    const count=(options||[]).length;
    const gridClass=count===2?'opts-grid-2':count===3?'opts-grid-3':'opts-grid-4';
    document.getElementById('opts-area').innerHTML=`<div class="${gridClass}">`+
      (options||[]).map((opt,i)=>{
        const n=ansArr.filter(a=>a.optionIndex===i).length;
        const pct=ansArr.length>0?Math.round((n/ansArr.length)*100):0;
        const isCorrect=answerRevealed&&i===correctIndex;
        return`<div class="opt-row${isCorrect?' correct':''}">
          <div class="opt-letter">${LETTERS[i]}</div>
          <div style="flex:1;min-width:0">
            <div class="opt-text">${opt}</div>
            ${ansArr.length>0?`<div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>`:''}
          </div>
          ${ansArr.length>0?`<div class="opt-count">${n}</div>`:''}
        </div>`;
      }).join('')+'</div>';
    if(answerRevealed&&fact){document.getElementById('fact-box').style.display='block';document.getElementById('fact-text').textContent=fact;}
    else document.getElementById('fact-box').style.display='none';
    document.getElementById('ans-count').textContent=ansArr.length;
    document.getElementById('ans-total').textContent=playerList.length;
    document.getElementById('ans-grid').innerHTML=ansArr.map(a=>{
      const correct=answerRevealed&&a.optionIndex===correctIndex;
      return`<span class="ans-chip${correct?' correct':''}">${a.name}:${LETTERS[a.optionIndex]}</span>`;
    }).join('');
    document.getElementById('reveal-btn').disabled=answerRevealed;
    const isLastQ=question>=totalQuestions-1,isLastR=round>=(totalRounds||3)-1;
    document.getElementById('next-btn').textContent=isLastQ&&isLastR?'Finalas':isLastQ?'Kitas etapas':'Kitas';
    return;
  }

  if(phase==='final'){
    document.getElementById('ph-final').classList.add('active');
    document.getElementById('final-lb').innerHTML=sorted.map((p,i)=>`
      <div class="lb-row${i===0?' top':''}">
        <span style="font-size:16px;width:24px">${medals[i]||'#'+(i+1)}</span>
        <span style="flex:1;font-size:13px;font-weight:500">${p.name}</span>
        <span class="lb-pts">${scores[p.id]||0}</span>
      </div>`).join('');
  }
}

function showQ(){
  ['lobby','question','lb','final'].forEach(p=>document.getElementById('ph-'+p).classList.remove('active'));
  document.getElementById('ph-question').classList.add('active');
}

// WakeLock
async function keepAwake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch(e){}}
keepAwake();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();});
</script>
</body>
</html>
