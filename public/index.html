
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eurovizija PopQuiznas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07061a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}

/* BG */
.bg{position:fixed;inset:-5%;background:url('/bg.jpg') center/cover no-repeat;animation:zoom 25s ease-in-out infinite alternate;will-change:transform;transform:translateZ(0);z-index:0;}
@keyframes zoom{from{transform:translateZ(0) scale(1);}to{transform:translateZ(0) scale(1.06);}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1;}

.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.screen.active{display:flex;}

/* JOIN */
.join-title{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:200;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-bottom:.3rem;}
.join-title strong{font-weight:800;}
.join-sub{font-size:.75rem;letter-spacing:.35em;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:3rem;}
.join-countdown{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:.3rem;font-variant-numeric:tabular-nums;}
.join-countdown.urgent{color:#ff6b6b;}
.join-countdown-lbl{font-size:.65rem;letter-spacing:.25em;color:rgba(255,255,255,.25);text-transform:uppercase;margin-bottom:2.5rem;}
.join-input{width:min(320px,100%);padding:1rem 1.25rem;border-radius:50px;border:.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:1rem;text-align:center;outline:none;letter-spacing:.05em;margin-bottom:.75rem;}
.join-input::placeholder{color:rgba(255,255,255,.3);}
.join-input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12);}
.join-btn{width:min(320px,100%);padding:1rem;border-radius:50px;border:none;background:#fff;color:#07061a;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.05em;}
.join-btn:active{opacity:.8;}
.players-list{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;max-width:360px;}
.player-chip{padding:.3rem .8rem;border-radius:20px;font-size:.75rem;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);}
.player-chip.me{background:rgba(124,92,252,.25);border-color:rgba(124,92,252,.5);color:#a68dff;}

/* WAIT */
.wait-icon{font-size:3rem;margin-bottom:1rem;}
.wait-title{font-size:1.2rem;font-weight:700;margin-bottom:.4rem;}
.wait-sub{font-size:.85rem;color:rgba(255,255,255,.4);}

/* QUESTION */
#s-question{justify-content:flex-start;padding:1.5rem 1.25rem;}
.q-timer-wrap{width:100%;margin-bottom:1.25rem;}
.q-timer-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.q-timer-fill{height:100%;background:#7c5cfc;border-radius:2px;transition:width 1s linear;}
.q-timer-fill.urgent{background:#ff5c5c;}
.q-timer-num{text-align:right;font-size:.75rem;color:rgba(255,255,255,.3);margin-top:.3rem;font-variant-numeric:tabular-nums;}
.q-status{text-align:center;font-size:.8rem;color:rgba(255,255,255,.3);letter-spacing:.05em;margin-bottom:1.5rem;}
.opts-2{display:grid;grid-template-columns:1fr;gap:10px;width:100%;}
.opts-3{display:grid;grid-template-columns:1fr;gap:10px;width:100%;}
.opts-4{display:grid;grid-template-columns:1fr;gap:10px;width:100%;}
.opt{border-radius:14px;border:.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;cursor:pointer;min-height:60px;padding:.75rem 1rem;transition:background .15s,border-color .15s;width:100%;text-align:left;}
.opt:active{opacity:.8;}
.opt-letter-badge{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:rgba(255,255,255,.6);flex-shrink:0;}
.opt-text-label{font-size:.95rem;font-weight:500;color:#fff;line-height:1.3;}
.opt.selected{background:rgba(124,92,252,.25);border-color:#7c5cfc;}
.opt.selected .opt-letter-badge{background:var(--pu);color:#fff;}
.opt.correct{background:rgba(62,207,142,.2);border-color:#3ecf8e;animation:pulse-green .4s ease;}
.opt.correct .opt-letter-badge{background:#3ecf8e;color:#fff;}
.opt.wrong{background:rgba(255,92,92,.15);border-color:#ff5c5c;opacity:.7;}
.opt.wrong .opt-letter-badge{background:rgba(255,92,92,.3);color:#ff5c5c;}
.opt.reveal-correct{background:rgba(62,207,142,.15);border-color:rgba(62,207,142,.5);}
.opt.reveal-correct .opt-letter-badge{background:#3ecf8e;color:#fff;}
.opt:disabled{cursor:default;}
@keyframes pulse-green{0%{transform:scale(1);}50%{transform:scale(1.04);}100%{transform:scale(1);}}

/* SENT */
#s-sent{text-align:center;}
.sent-icon{font-size:3.5rem;margin-bottom:.75rem;}
.sent-title{font-size:1.1rem;font-weight:700;margin-bottom:.3rem;}
.sent-sub{font-size:.85rem;color:rgba(255,255,255,.35);}
.sent-timer{font-size:2.5rem;font-weight:800;color:rgba(255,255,255,.2);margin-top:1.5rem;font-variant-numeric:tabular-nums;}

/* REVEAL */
#s-reveal{text-align:center;}
.reveal-result{font-size:4rem;margin-bottom:.5rem;}
.reveal-text{font-size:1.3rem;font-weight:700;margin-bottom:.3rem;}
.reveal-score{font-size:.85rem;color:rgba(255,255,255,.35);}

/* LB */
#s-lb{justify-content:flex-start;padding:1.5rem 1.25rem;}
.lb-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem;width:100%;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:6px;width:100%;}
.lb-row.top{background:rgba(245,200,66,.08);border:.5px solid rgba(245,200,66,.2);}
.lb-row.me{background:rgba(124,92,252,.12);border:.5px solid rgba(124,92,252,.3);}
.lb-pts{font-size:1.2rem;font-weight:700;color:#a68dff;}
.lb-row.top .lb-pts{color:#f5c842;}

/* FINAL */
#s-final{text-align:center;}
.final-trophy{font-size:4rem;margin-bottom:.5rem;}
.final-winner{font-size:1.8rem;font-weight:800;color:#f5c842;margin-bottom:.2rem;}
.final-sub{font-size:.85rem;color:rgba(255,255,255,.35);margin-bottom:1.5rem;}
.final-my{font-size:.95rem;color:rgba(255,255,255,.5);}
.final-my span{color:#a68dff;font-weight:700;}

/* CHEAT WARNING */
.cheat-banner{position:fixed;top:0;left:0;right:0;background:#ff5c5c;color:#fff;text-align:center;padding:.5rem;font-size:.85rem;font-weight:600;z-index:99;transform:translateY(-100%);transition:transform .3s;}
.cheat-banner.show{transform:translateY(0);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="overlay"></div>
<div class="cheat-banner" id="cheat-banner">Grizk i zaidima!</div>

<!-- JOIN -->
<div class="screen active" id="s-join">
  <div class="join-title">Eurovizijos <strong>PopQuiznas</strong></div>
  <div class="join-sub">Viena · 2026</div>
  <div class="join-countdown" id="join-countdown">9:30</div>
  <div class="join-countdown-lbl">iki pradžios</div>
  <input class="join-input" id="name-input" type="text" placeholder="Tavo vardas" maxlength="20" autocomplete="off" onkeyup="if(event.key==='Enter')join()">
  <button class="join-btn" onclick="join()">Prisijungti</button>
  <div class="players-list" id="players-list"></div>
</div>

<!-- WAIT -->
<div class="screen" id="s-wait">
  <div class="wait-icon">🎤</div>
  <div class="wait-title">Prisijungei!</div>
  <div class="wait-sub" id="wait-sub">Laukiama pradžios...</div>
  <div class="join-countdown" id="wait-countdown" style="margin-top:1.5rem"></div>
  <div class="join-countdown-lbl">iki pradžios</div>
</div>

<!-- QUESTION -->
<div class="screen" id="s-question">
  <div class="q-timer-wrap">
    <div class="q-timer-bar"><div class="q-timer-fill" id="q-timer-fill" style="width:100%"></div></div>
    <div class="q-timer-num" id="q-timer-num">15</div>
  </div>
  <div class="q-text-player" id="q-text-player" style="font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:1.25rem;line-height:1.4;color:#fff;"></div>
  <div class="q-status" id="q-status"></div>
  <div id="q-opts" style="width:100%"></div>
</div>

<!-- SENT -->
<div class="screen" id="s-sent">
  <div class="sent-icon">✅</div>
  <div class="sent-title">Atsakymas pateiktas!</div>
  <div class="sent-sub">Laukiama rezultato...</div>
  <div class="sent-timer" id="sent-timer"></div>
</div>

<!-- REVEAL -->
<div class="screen" id="s-reveal">
  <div class="reveal-result" id="reveal-result"></div>
  <div class="reveal-text" id="reveal-text"></div>
  <div class="reveal-score" id="reveal-score"></div>
</div>

<!-- LB -->
<div class="screen" id="s-lb">
  <div class="lb-title">Rikiuotė</div>
  <div id="lb-list" style="width:100%"></div>
</div>

<!-- FINAL -->
<div class="screen" id="s-final">
  <div class="final-trophy">🏆</div>
  <div class="final-winner" id="final-winner"></div>
  <div class="final-sub">Laimėtojas!</div>
  <div class="final-my" id="final-my"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const LETTERS = ['A','B','C','D'];
let socket, myId, myName, myLastOpt = null;
let lastQ = -1, lastRound = -1;
let lobbyInterval;
let currentTimeLeft = 15;
let wasRevealed = false;

// Sounds
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx;
function getActx(){ if(!actx) actx = new AudioCtx(); return actx; }

function playCorrect(){
  try{
    const ctx = getActx();
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq;
      o.type = 'sine';
      const t = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.05);
      g.gain.linearRampToValueAtTime(0, t + 0.2);
      o.start(t); o.stop(t + 0.25);
    });
  }catch(e){}
}

function playWrong(){
  try{
    const ctx = getActx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 220;
    o.type = 'sawtooth';
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.4);
  }catch(e){}
}

function vibrate(ok){ try{ navigator.vibrate(ok ? [100,50,100] : [300]); }catch(e){} }

// Anti-cheat
document.addEventListener('visibilitychange', () => {
  if(document.hidden && socket && myId){
    socket.emit('player:blur');
    const b = document.getElementById('cheat-banner');
    b.classList.add('show');
    setTimeout(()=>b.classList.remove('show'), 3000);
  }
});


// Prisijungiame is karto puslapiui atsidarius - tik gauti laika
const preSocket = io();
preSocket.on('lobby_timer', ({timeLeft}) => {
  const m=Math.floor(timeLeft/60), s=timeLeft%60;
  const fmt=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  ['join-countdown','wait-countdown'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.textContent=fmt;el.classList.toggle('urgent',timeLeft<=60);}
  });
});

function join(){
  const name = document.getElementById('name-input').value.trim();
  if(!name) return;
  myName = name;
  socket = preSocket; // naudojame jau esama rysio
  socket.emit('join', {name});
  socket.on('connect', ()=>{ myId = socket.id; socket.emit('join', {name}); });
  socket.on('joined', ({id})=>{ myId = id; setScreen('s-wait'); });
  socket.on('join_error', ({message})=>{
    const inp=document.getElementById('name-input');
    inp.style.borderColor='#ff5c5c';
    inp.placeholder=message;
    inp.value='';
    setTimeout(()=>{inp.style.borderColor='';inp.placeholder='Tavo vardas';},3000);
  });
  socket.on('state', handleState);
  socket.on("lobby_timer", ({timeLeft}) => {
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const fmt=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  const jc=document.getElementById("join-countdown");
  const wc=document.getElementById("wait-countdown");
  if(jc){jc.textContent=fmt;jc.classList.toggle("urgent",timeLeft<=60);}
  if(wc){wc.textContent=fmt;wc.classList.toggle("urgent",timeLeft<=60);}
});
socket.on("timer", ({timeLeft})=>{
    currentTimeLeft = timeLeft;
    updateTimer(timeLeft);
  });
}

function handleState(s){
  const players = Object.values(s.players || {});
  const qChanged = s.question !== lastQ || s.round !== lastRound;
  if(qChanged){ myLastOpt = null; lastQ = s.question; lastRound = s.round; wasRevealed = false; }

  // Update lobby players list
  const pl = document.getElementById('players-list');
  if(pl){
    pl.innerHTML = players.map(p =>
      `<div class="player-chip${p.id===myId?' me':''}">${p.name}</div>`
    ).join('');
  }

  if(s.phase === 'lobby') return;

  if(s.phase === 'question'){
    const myAns = s.answers?.[myId];
    const count = s.optionCount || s.options?.length || 4;
    const gridClass = count===2?'opts-2':count===3?'opts-3':'opts-4';
    const total = players.length;
    const answered = Object.keys(s.answers||{}).length;

    document.getElementById('q-status').textContent =
      `${s.roundName} · ${s.question+1}/${s.totalQuestions} · Atsakė: ${answered}/${total}`;
    const qt=document.getElementById('q-text-player');
    if(qt) qt.textContent=s.questionText||'';

    if(s.answerRevealed && !wasRevealed){
      wasRevealed = true;
      // Show reveal screen
      const correct = myAns && myAns.optionIndex === s.correctIndex;
      const answered2 = !!myAns;
      if(answered2){
        document.getElementById('reveal-result').textContent = correct ? '🎉' : '😔';
        document.getElementById('reveal-text').textContent = correct ? 'Teisingai!' : 'Neteisingai';
        document.getElementById('reveal-score').textContent = `Taškai: ${s.scores?.[myId]||0}`;
        if(correct){ playCorrect(); vibrate(true); }
        else{ playWrong(); vibrate(false); }
        setScreen('s-reveal');
      } else {
        // Show correct on question screen
        renderOpts(s, myAns, true, gridClass);
        setScreen('s-question');
      }
      // Auto go to LB after 2.5 sec
      setTimeout(()=>{
        renderLb(s);
        setScreen('s-lb');
      }, 2500);
      return;
    }

    if(!s.answerRevealed){
      wasRevealed = false;
      if(myAns){
        document.getElementById('sent-timer').textContent = '';
        setScreen('s-sent');
      } else {
        renderOpts(s, null, false, gridClass);
        setScreen('s-question');
      }
    }
    return;
  }

  if(s.phase === 'final'){
    const sorted = Object.entries(s.scores||{}).sort((a,b)=>b[1]-a[1]);
    const winId = sorted[0]?.[0];
    const winPlayer = players.find(p=>p.id===winId);
    document.getElementById('final-winner').textContent = winPlayer?.name || '?';
    document.getElementById('final-my').innerHTML =
      `Tavo rezultatas: <span>${s.scores?.[myId]||0} tasku</span>`;
    setScreen('s-final');
  }
}

function renderOpts(s, myAns, revealed, gridClass){
  const html = `<div class="${gridClass}">` + (s.options||[]).map((opt,i)=>{
    let cls = 'opt';
    if(revealed){
      if(i === s.correctIndex) cls += ' reveal-correct';
      else if(myAns && myAns.optionIndex === i) cls += ' wrong';
    } else if(myAns?.optionIndex === i) cls += ' selected';
    const disabled = (revealed || myAns) ? 'disabled' : '';
    return `<button class="${cls}" ${disabled} onclick="answer(${i})">
      <span class="opt-letter-badge">${LETTERS[i]}</span>
      <span class="opt-text-label">${opt}</span>
    </button>`;
  }).join('') + '</div>';
  document.getElementById('q-opts').innerHTML = html;
}

function renderLb(s){
  const players = Object.values(s.players||{});
  const sorted = Object.entries(s.scores||{}).sort((a,b)=>b[1]-a[1]);
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('lb-list').innerHTML = sorted.map(([id,pts],i)=>{
    const p = players.find(x=>x.id===id);
    return `<div class="lb-row${i===0?' top':''}${id===myId?' me':''}">
      <span style="font-size:1.1rem;width:24px">${medals[i]||'#'+(i+1)}</span>
      <span style="flex:1;font-size:.9rem;font-weight:500">${p?.name||'?'}${id===myId?' (tu)':''}</span>
      <span class="lb-pts">${pts}</span>
    </div>`;
  }).join('');
}

function updateTimer(timeLeft){
  const pct = (timeLeft / 15) * 100;
  const fill = document.getElementById('q-timer-fill');
  const num = document.getElementById('q-timer-num');
  if(fill){ fill.style.width = pct+'%'; fill.classList.toggle('urgent', timeLeft<=5); }
  if(num) num.textContent = timeLeft;
  const st = document.getElementById('sent-timer');
  if(st) st.textContent = timeLeft;
}

function answer(idx){
  if(myLastOpt !== null) return;
  myLastOpt = idx;
  socket.emit('player:answer', {optionIndex: idx});
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled = true;
    if(i===idx) b.classList.add('selected');
  });
  document.getElementById('sent-timer').textContent = currentTimeLeft;
  setScreen('s-sent');
}

function setScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}


</script>
</body>
</html>
